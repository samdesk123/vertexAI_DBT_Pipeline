# dbt_component.yaml
name: dbt-run-component
description: A component to run a dbt job.
implementation:
  container:
    image: gcr.io/your-project-id/dbt-runner:latest
    # command to execute when the container starts
    command: ["dbt", "run"]
    args:
      - --project-dir
      - /dbt/vertexAI
      - --profiles-dir
      - /dbt/vertexAI